<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldBodyGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="letterSGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <filter id="innerDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#78350f" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Subtle App Icon Highlight on Top Edge -->
  <path d="M 115,0 L 397,0 C 460,0 512,52 512,115 L 512,200 C 420,130 300,100 0,160 L 0,115 C 0,52 52,0 115,0 Z" fill="#ffffff" opacity="0.12" />

  <!-- Ground Shadow under Mascot -->
  <ellipse cx="256" cy="438" rx="130" ry="24" fill="url(#shadowGrad)" />

  <!-- MASCOT GROUP -->
  <g filter="url(#softGlow)">
    <!-- FEET / SHOES -->
    <!-- Left Shoe -->
    <ellipse cx="205" cy="428" rx="34" ry="18" fill="#d97706" />
    <ellipse cx="205" cy="425" rx="32" ry="16" fill="url(#goldBodyGrad)" />
    <ellipse cx="201" cy="422" rx="16" ry="6" fill="#fffbeb" opacity="0.6" />

    <!-- Right Shoe -->
    <ellipse cx="307" cy="428" rx="34" ry="18" fill="#b45309" />
    <ellipse cx="307" cy="425" rx="32" ry="16" fill="url(#goldBodyGrad)" />
    <ellipse cx="303" cy="422" rx="16" ry="6" fill="#fffbeb" opacity="0.6" />

    <!-- RIGHT ARM (Holding Phone to Ear) -->
    <!-- Arm segment -->
    <path d="M 330,260 Q 380,240 372,185 Q 360,190 325,235 Z" fill="url(#goldBevel)" />
    <path d="M 332,256 Q 375,238 368,188" stroke="#fffbeb" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
    <!-- Hand on phone -->
    <circle cx="366" cy="186" r="15" fill="url(#goldBodyGrad)" />
    <circle cx="360" cy="180" r="7" fill="#d97706" />

    <!-- SMARTPHONE -->
    <g transform="rotate(14, 385, 175)">
      <!-- Phone Shadow -->
      <rect x="368" y="128" width="38" height="74" rx="8" fill="#020617" opacity="0.4" />
      <!-- Phone Body -->
      <rect x="366" y="125" width="38" height="74" rx="8" fill="url(#phoneGrad)" stroke="#f59e0b" stroke-width="2" />
      <!-- Phone Screen Glass -->
      <rect x="370" y="131" width="30" height="62" rx="5" fill="#1e293b" />
      <!-- Screen content (mini gold chart glowing) -->
      <path d="M 374,175 L 380,168 L 386,170 L 394,152" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="394" cy="152" r="2.5" fill="#22c55e" />
      <!-- Phone camera / speaker notch -->
      <rect x="379" y="128" width="12" height="2" rx="1" fill="#475569" />
    </g>

    <!-- LEFT ARM (Raised & Cheerful Waving Hand) -->
    <!-- Arm reaching up-left -->
    <path d="M 180,260 C 130,230 115,160 120,115 C 135,112 145,135 185,225 Z" fill="url(#goldBevel)" />
    <path d="M 175,250 C 138,220 126,165 128,125" stroke="#fffbeb" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Waving Hand & 5 Fingers -->
    <!-- Palm -->
    <circle cx="120" cy="115" r="18" fill="url(#goldBodyGrad)" />
    <!-- Thumb -->
    <ellipse cx="140" cy="112" rx="7" ry="12" transform="rotate(35, 140, 112)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Index finger -->
    <ellipse cx="126" cy="92" rx="6.5" ry="15" transform="rotate(10, 126, 92)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Middle finger -->
    <ellipse cx="112" cy="88" rx="6.5" ry="16" transform="rotate(-5, 112, 88)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Ring finger -->
    <ellipse cx="98" cy="94" rx="6" ry="14" transform="rotate(-20, 98, 94)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Pinky finger -->
    <ellipse cx="88" cy="106" rx="5.5" ry="12" transform="rotate(-35, 88, 106)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="1.5" />
    <!-- Palm highlight -->
    <circle cx="116" cy="114" r="8" fill="#fffbeb" opacity="0.5" />

    <!-- MAIN BODY: THE GOLD BULLION / INGOT -->
    <!-- Outer Ingot Shadow Bevel -->
    <rect x="156" y="110" width="200" height="285" rx="36" fill="#78350f" />

    <!-- 3D Beveled Edge of the Gold Bar -->
    <rect x="158" y="112" width="196" height="280" rx="34" fill="url(#goldBevel)" />

    <!-- Front Surface of Ingot (Recessed Ingot Face) -->
    <rect x="170" y="124" width="172" height="256" rx="26" fill="url(#goldBodyGrad)" />

    <!-- Specular Highlight Curve on Top of Ingot -->
    <path d="M 172,145 C 172,130 185,125 205,125 L 307,125 C 327,125 340,130 340,145 C 300,165 210,165 172,145 Z" fill="url(#goldHighlight)" />
    <line x1="185" y1="130" x2="327" y2="130" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85" />

    <!-- Chamfered Edge Line Accents (Bullion Structure) -->
    <path d="M 158,145 L 170,154 M 354,145 L 342,154 M 158,360 L 170,350 M 354,360 L 342,350" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- CARTOON EYES -->
    <!-- Eyebrows -->
    <!-- Left Brow -->
    <path d="M 194,175 Q 212,164 230,172" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Right Brow -->
    <path d="M 282,172 Q 300,164 318,175" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Left Eye White -->
    <ellipse cx="215" cy="198" rx="20" ry="25" fill="#ffffff" stroke="#92400e" stroke-width="2" />
    <!-- Left Iris (Warm Chocolate Brown) -->
    <ellipse cx="218" cy="198" rx="14" ry="17" fill="#451a03" />
    <!-- Left Pupil -->
    <ellipse cx="220" cy="198" rx="10" ry="12" fill="#170902" />
    <!-- Big Catchlight -->
    <circle cx="215" cy="190" r="5" fill="#ffffff" />
    <!-- Small Secondary Catchlight -->
    <circle cx="224" cy="204" r="2.5" fill="#ffffff" opacity="0.9" />

    <!-- Right Eye White -->
    <ellipse cx="297" cy="198" rx="20" ry="25" fill="#ffffff" stroke="#92400e" stroke-width="2" />
    <!-- Right Iris (Warm Chocolate Brown) -->
    <ellipse cx="294" cy="198" rx="14" ry="17" fill="#451a03" />
    <!-- Right Pupil -->
    <ellipse cx="292" cy="198" rx="10" ry="12" fill="#170902" />
    <!-- Big Catchlight -->
    <circle cx="289" cy="190" r="5" fill="#ffffff" />
    <!-- Small Secondary Catchlight -->
    <circle cx="298" cy="204" r="2.5" fill="#ffffff" opacity="0.9" />

    <!-- Cute Cheeks / Blush -->
    <ellipse cx="188" cy="216" rx="10" ry="6" fill="#f43f5e" opacity="0.35" />
    <ellipse cx="324" cy="216" rx="10" ry="6" fill="#f43f5e" opacity="0.35" />

    <!-- HAPPY SMILE WITH TONGUE -->
    <path d="M 234,216 Q 256,242 278,216" stroke="#78350f" stroke-width="4.5" stroke-linecap="round" fill="#451a03" />
    <!-- Smile opening with pink tongue -->
    <path d="M 237,218 Q 256,244 275,218 Z" fill="#451a03" />
    <path d="M 246,226 Q 256,222 266,226 Q 256,242 246,226 Z" fill="#fb7185" />
    <!-- Smile corner dimples -->
    <path d="M 232,213 Q 235,217 236,220" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
    <path d="M 280,213 Q 277,217 276,220" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

    <!-- EMBOSSED LETTER 'S' (SARRAF BRAND MARK ON CHEST) -->
    <g filter="url(#innerDepth)">
      <!-- Outer Engraved Groove -->
      <path d="M 282,282 C 282,266 268,260 256,258 C 242,256 232,252 232,244 C 232,236 240,230 254,230 C 268,230 276,236 278,242" 
            stroke="#78350f" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.4" />
      <path d="M 230,302 C 232,310 242,318 258,318 C 274,318 284,310 284,298 C 284,288 274,282 258,280 C 242,278 230,272 230,258" 
            stroke="#78350f" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.4" />

      <!-- Main Embossed 'S' Stroke with Metallic Finish -->
      <path d="M 276,260 C 274,250 264,244 254,244 C 244,244 238,249 238,256 C 238,265 248,269 262,272 C 278,275 288,284 288,298 C 288,314 274,324 256,324 C 238,324 226,314 224,300" 
            stroke="url(#letterSGrad)" stroke-width="12" stroke-linecap="round" fill="none" />

      <!-- Golden Light Reflection on the 'S' -->
      <path d="M 275,259 C 273,251 264,246 254,246 C 245,246 240,250 240,256 C 240,263 248,267 262,270" 
            stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
      <path d="M 286,298 C 286,312 273,322 256,322 C 240,322 230,314 226,303" 
            stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
    </g>

    <!-- Subtitle Engraving under 'S': '995.0' or 'SARRAF' -->
    <text x="256" y="356" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="4" fill="#92400e" text-anchor="middle" opacity="0.85">SARRAF</text>
    <text x="256" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#78350f" text-anchor="middle" opacity="0.65">999.9 HAS ALTIN</text>
  </g>
</svg>
