<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="100%" height="100%">
  <defs>
    <!-- Background Halo -->
    <radialGradient id="haloGlow" cx="42%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#fef0cd" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#fdf4dc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldBodyGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fffce0" />
      <stop offset="10%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9db" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="goldLimbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="phoneBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="phoneScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fcfbfa" />
      <stop offset="100%" stop-color="#f5f2eb" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softDropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" />
    </filter>
    <filter id="engravedS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#78350f" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Phone & Mascot -->
  <circle cx="430" cy="420" r="360" fill="url(#haloGlow)" />

  <!-- Ground Contact Shadows -->
  <g filter="url(#groundShadow)">
    <ellipse cx="310" cy="745" rx="190" ry="24" fill="#000000" opacity="0.22" />
    <ellipse cx="690" cy="735" rx="140" ry="20" fill="#000000" opacity="0.25" />
    <ellipse cx="640" cy="740" rx="45" ry="12" fill="#78350f" opacity="0.35" />
    <ellipse cx="760" cy="740" rx="45" ry="12" fill="#78350f" opacity="0.35" />
  </g>

  <!-- ==================== 1. THE SMARTPHONE (LEFT SIDE) ==================== -->
  <g filter="url(#softDropShadow)" transform="rotate(-3, 310, 420)">
    <!-- Phone Outer Border / Chassis -->
    <rect x="110" y="80" width="380" height="660" rx="58" fill="url(#phoneBezelGrad)" stroke="#334155" stroke-width="4" />

    <!-- Phone Inner Screen -->
    <rect x="122" y="92" width="356" height="636" rx="48" fill="url(#phoneScreenGrad)" />

    <!-- Dynamic Island Pill -->
    <rect x="250" y="106" width="100" height="26" rx="13" fill="#0f172a" />
    <!-- Camera lens in pill -->
    <circle cx="328" cy="119" r="5" fill="#1e293b" />
    <circle cx="328" cy="119" r="2" fill="#0284c7" opacity="0.8" />

    <!-- Status Bar Elements -->
    <text x="160" y="124" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1e293b">09:41</text>
    <!-- Wifi & Battery Icons placeholder -->
    <g fill="#1e293b" transform="translate(410, 112)">
      <rect x="14" y="2" width="20" height="10" rx="3" fill="none" stroke="#1e293b" stroke-width="2" />
      <rect x="16" y="4" width="12" height="6" rx="1.5" />
      <path d="M 35,5.5 L 36.5,5.5 L 36.5,8.5 L 35,8.5 Z" />
    </g>

    <!-- Top Navigation / App Title Bar -->
    <g transform="translate(148, 146)">
      <circle cx="16" cy="16" r="16" fill="#fef3c7" />
      <text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">S</text>
      <text x="42" y="16" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Cepte Sarraf</text>
      <text x="42" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">İzmir Piyasası ▾</text>
    </g>

    <!-- App Hero Card (Gold/Blue Soft Gradient) -->
    <rect x="144" y="196" width="312" height="130" rx="22" fill="url(#cardGrad)" />
    <rect x="144" y="196" width="312" height="130" rx="22" fill="#ffffff" fill-opacity="0.25" stroke="#fcd34d" stroke-width="1.5" />
    <text x="166" y="228" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#92400e">CANLI ALTIN HESAPLAMA</text>
    <text x="166" y="266" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#0f172a">₺ 12.480</text>
    <text x="166" y="294" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">14 Ayar • 4,20 g • İzmir Ortalaması</text>

    <!-- Karat Pills -->
    <g transform="translate(144, 342)">
      <rect x="0" y="0" width="70" height="28" rx="14" fill="#f1f5f9" />
      <text x="35" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">8 Ayar</text>

      <rect x="78" y="0" width="80" height="28" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="118" y="18" font-family="sans-serif" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">14 Ayar ✓</text>

      <rect x="166" y="0" width="70" height="28" rx="14" fill="#f1f5f9" />
      <text x="201" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">18 Ayar</text>

      <rect x="244" y="0" width="68" height="28" rx="14" fill="#f1f5f9" />
      <text x="278" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">22 Ayar</text>
    </g>

    <!-- List Rows (Simulating App Content) -->
    <!-- Row 1 -->
    <g transform="translate(144, 390)">
      <rect x="0" y="0" width="312" height="62" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
      <circle cx="30" cy="31" r="18" fill="#fef9c3" />
      <text x="30" y="36" font-family="sans-serif" font-size="14" text-anchor="middle">🪙</text>
      <rect x="60" y="20" width="100" height="10" rx="5" fill="#334155" opacity="0.8" />
      <rect x="60" y="34" width="60" height="8" rx="4" fill="#94a3b8" opacity="0.6" />
      <text x="290" y="36" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="end">₺ 3.025</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(144, 464)">
      <rect x="0" y="0" width="312" height="62" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
      <circle cx="30" cy="31" r="18" fill="#fef3c7" />
      <text x="30" y="36" font-family="sans-serif" font-size="14" text-anchor="middle">💍</text>
      <rect x="60" y="20" width="110" height="10" rx="5" fill="#334155" opacity="0.8" />
      <rect x="60" y="34" width="70" height="8" rx="4" fill="#94a3b8" opacity="0.6" />
      <text x="290" y="36" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a" text-anchor="end">₺ 1.840</text>
    </g>

    <!-- Row 3 (Bottom Two Mini Cards) -->
    <g transform="translate(144, 538)">
      <rect x="0" y="0" width="150" height="100" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
      <rect x="16" y="16" width="30" height="30" rx="10" fill="#ecfdf5" />
      <text x="31" y="36" font-family="sans-serif" font-size="15" text-anchor="middle">📈</text>
      <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">Hızlı Alım/Satım</text>
      <text x="16" y="84" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#059669">+%1,42</text>

      <rect x="162" y="0" width="150" height="100" rx="18" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5" />
      <rect x="178" y="16" width="30" height="30" rx="10" fill="#eff6ff" />
      <text x="193" y="36" font-family="sans-serif" font-size="15" text-anchor="middle">🏛️</text>
      <text x="178" y="66" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">Kapalıçarşı Farkı</text>
      <text x="178" y="84" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#2563eb">₺ 24,50</text>
    </g>

    <!-- Home Indicator Bar -->
    <rect x="235" y="710" width="130" height="5" rx="2.5" fill="#94a3b8" />
  </g>

  <!-- ==================== 2. THE 3D GOLD BAR MASCOT (RIGHT SIDE) ==================== -->
  <g filter="url(#softDropShadow)">
    <!-- LEGS & SHOES -->
    <!-- Left Leg (Viewer's Left) -->
    <g>
      <path d="M 645,630 L 640,715" stroke="url(#goldLimbGrad)" stroke-width="32" stroke-linecap="round" />
      <ellipse cx="635" cy="728" rx="38" ry="18" fill="#92400e" />
      <ellipse cx="635" cy="724" rx="35" ry="16" fill="url(#goldBodyGrad)" />
      <ellipse cx="628" cy="718" rx="18" ry="7" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Right Leg (Viewer's Right) -->
    <g>
      <path d="M 755,630 L 765,715" stroke="url(#goldLimbGrad)" stroke-width="32" stroke-linecap="round" />
      <ellipse cx="770" cy="728" rx="38" ry="18" fill="#92400e" />
      <ellipse cx="770" cy="724" rx="35" ry="16" fill="url(#goldBodyGrad)" />
      <ellipse cx="762" cy="718" rx="18" ry="7" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- MASCOT LEFT ARM (Reaching across and resting on the smartphone edge) -->
    <g>
      <!-- Arm from mascot's left side towards phone -->
      <path d="M 570,440 C 510,430 465,390 460,370" stroke="url(#goldLimbGrad)" stroke-width="32" stroke-linecap="round" fill="none" />
      <path d="M 570,436 C 512,426 470,388 464,370" stroke="#fff9db" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />

      <!-- Hand holding the smartphone rim -->
      <circle cx="458" cy="370" r="20" fill="url(#goldBodyGrad)" />
      <!-- Fingers wrapped slightly on phone rim -->
      <ellipse cx="448" cy="358" rx="7" ry="12" transform="rotate(-20, 448, 358)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="2" />
      <ellipse cx="444" cy="375" rx="7" ry="12" transform="rotate(-5, 444, 375)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="2" />
      <ellipse cx="448" cy="392" rx="7" ry="11" transform="rotate(15, 448, 392)" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="2" />
    </g>

    <!-- MASCOT RIGHT ARM (Resting on Hip) -->
    <g>
      <!-- Elbow out to right, hand back on hip -->
      <path d="M 830,470 C 885,490 890,560 840,575" stroke="url(#goldLimbGrad)" stroke-width="32" stroke-linecap="round" fill="none" />
      <path d="M 830,466 C 880,486 886,554 842,572" stroke="#fff9db" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />
      <!-- Hand on hip -->
      <circle cx="832" cy="576" r="20" fill="url(#goldBodyGrad)" />
      <ellipse cx="830" cy="576" rx="14" ry="9" fill="#ffffff" opacity="0.4" />
    </g>

    <!-- MAIN GOLD INGOT BODY (3D Rounded Bullion Bar) -->
    <!-- Outer Ingot Inset / 3D Base -->
    <rect x="548" y="278" width="304" height="394" rx="46" fill="url(#goldBodyGrad)" stroke="#b45309" stroke-width="6" />

    <!-- Front Beveled Face -->
    <rect x="562" y="292" width="276" height="366" rx="38" fill="url(#goldFrontGrad)" />

    <!-- Specular Highlight Curve (Top & Left Edge of Ingot) -->
    <path d="M 580,300 L 820,300 C 830,300 835,306 830,314 L 576,314 C 570,306 574,300 580,300 Z" fill="#ffffff" opacity="0.75" />
    <path d="M 570,310 L 570,640" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.4" />

    <!-- CUTE CARTOON FACE -->
    <!-- Eyebrows -->
    <!-- Left Eyebrow -->
    <path d="M 622,345 C 636,335 656,336 668,348" stroke="#713f12" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Right Eyebrow -->
    <path d="M 732,348 C 744,336 764,335 778,345" stroke="#713f12" stroke-width="7" stroke-linecap="round" fill="none" />

    <!-- Left Eye -->
    <g>
      <!-- White eye base with subtle shadow -->
      <ellipse cx="648" cy="382" rx="28" ry="32" fill="#ffffff" stroke="#78350f" stroke-width="3" />
      <!-- Pupil / Iris (Dark brown / warm black) -->
      <ellipse cx="654" cy="382" rx="20" ry="24" fill="#291807" />
      <circle cx="654" cy="382" r="14" fill="#451a03" />
      <!-- Big Sparkle Highlight -->
      <circle cx="646" cy="372" r="8" fill="#ffffff" />
      <!-- Secondary Mini Sparkle -->
      <circle cx="660" cy="390" r="3.5" fill="#ffffff" />
    </g>

    <!-- Right Eye -->
    <g>
      <!-- White eye base with subtle shadow -->
      <ellipse cx="752" cy="382" rx="28" ry="32" fill="#ffffff" stroke="#78350f" stroke-width="3" />
      <!-- Pupil / Iris -->
      <ellipse cx="746" cy="382" rx="20" ry="24" fill="#291807" />
      <circle cx="746" cy="382" r="14" fill="#451a03" />
      <!-- Big Sparkle Highlight -->
      <circle cx="738" cy="372" r="8" fill="#ffffff" />
      <!-- Secondary Mini Sparkle -->
      <circle cx="752" cy="390" r="3.5" fill="#ffffff" />
    </g>

    <!-- Happy Open Smile with Tongue -->
    <g>
      <!-- Mouth cavity -->
      <path d="M 672,425 Q 700,460 728,425 Z" fill="#781d1d" stroke="#581c1c" stroke-width="3" />
      <!-- Red / Pink Tongue -->
      <path d="M 684,440 Q 700,432 716,440 Q 700,458 684,440 Z" fill="#f43f5e" />
    </g>

    <!-- Rosy Cheek Blushes -->
    <ellipse cx="612" cy="415" rx="16" ry="8" fill="#f59e0b" opacity="0.45" />
    <ellipse cx="788" cy="415" rx="16" ry="8" fill="#f59e0b" opacity="0.45" />

    <!-- ENGRAVED "S" MONOGRAM ON CHEST -->
    <g filter="url(#engravedS)">
      <!-- Outer engraved groove -->
      <path d="M 726,498 C 720,486 708,480 694,480 C 674,480 660,494 660,512 C 660,534 676,544 694,554 C 716,564 732,576 732,600 C 732,624 714,640 688,640 C 670,640 656,630 648,616" 
            stroke="#92400e" stroke-width="24" stroke-linecap="round" fill="none" />
      <!-- Inner gold face of the S -->
      <path d="M 726,498 C 720,486 708,480 694,480 C 674,480 660,494 660,512 C 660,534 676,544 694,554 C 716,564 732,576 732,600 C 732,624 714,640 688,640 C 670,640 656,630 648,616" 
            stroke="url(#goldBodyGrad)" stroke-width="15" stroke-linecap="round" fill="none" />
      <!-- Inner Specular highlight on S -->
      <path d="M 724,496 C 718,486 706,482 694,482 C 678,482 664,494 664,510" 
            stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>
  </g>
</svg>
